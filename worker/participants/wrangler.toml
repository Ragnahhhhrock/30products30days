name = "30p30d-participants"
main = "index.js"
compatibility_date = "2026-11-01"

# Keep the workers.dev URL on: the site front end (participants/p.js) calls it. Adding `routes` turns it off by default on deploy.
workers_dev = true

# Public participant pages and sitemap are served from the main domain (needs the domain proxied through Cloudflare).
routes = [
  { pattern = "30products30days.com/u/*", zone_name = "30products30days.com" },
  { pattern = "www.30products30days.com/u/*", zone_name = "30products30days.com" },
  { pattern = "30products30days.com/sitemap-participants.xml", zone_name = "30products30days.com" },
]

# Cloudflare Email Service sending binding (domain 30products30days.com must be onboarded for sending; needs Workers Paid for arbitrary recipients).
send_email = [{ name = "EMAIL" }]

[[d1_databases]]
binding = "DB"
database_name = "30p30d-participants"
database_id = "c852b8ca-0a5f-4171-9706-c4a3ece184d1"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "30p30d-participant-images"

[vars]
ADMIN_EMAILS = "contact@30products30days.com"   # comma separated organiser emails
SPAM_EXEMPT_EMAILS = "yes.thatmichael@gmail.com"   # approved participants whose posts skip the keyword spam check

# Secret (set in the dashboard): TURNSTILE_SECRET
